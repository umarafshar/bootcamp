<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>IPL 2026 Winner Guess</title>
</head>

<body>
    <main>
        <!-- IPL Winner Guess -->
        <section class="cotainer">
            <h1 class="title">IPL 2026 Winner Guess</h1>

            <div class="card">
                <img clas="card__logo" src="./Assets/unknown.png" alt="" class="card__logo">
                <h2 class="card__team-name">***</h2>
                <p class="card__team-captain">***</p>
                <p class="card__team-owner">***</p>
            </div>
            <button class="btn btn-1">Guess Winner</button>
        </section>

        <!-- Rock Paper Scissors Game  -->
        <section class="cotainer">
            <h2 class="title2">Rock Paper Scissors Game</h2>

            <div class="card-wrapper">
                <div class="game-card">
                    <div class="card__left">
                        <img class="card__left-img" src="./Assets/unknown.png" alt="">
                        <h3 class="card__left-title">***</h3>
                        <p class="card__left-player">Player 1</p>
                    </div>
                    <div class="card__right">
                        <img class="card__right-img" src="./Assets/unknown.png" alt="">
                        <h3 class="card__right-title">***</h3>
                        <p class="card__right-player">Player 2</p>
                    </div>
                </div>

                <h2 class="result">Lets Play</h2>
            </div>

            <button class="btn btn-2">Play Game</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
